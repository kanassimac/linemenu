<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>敬拜同工查詢｜花蓮靈糧堂</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #2E7EE8; --blue-dk: #1A5CBF; --blue-lt: #EBF2FD;
    --orange: #E8892E; --orange-lt: #FDF1E4;
    --green: #06C755;
    --gray-1: #F4F6F9; --gray-2: #E3E8EE; --gray-3: #B0BAC6; --gray-4: #6B7A8D;
    --black: #1A2130; --white: #FFFFFF;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font); background: var(--gray-1); color: var(--black); line-height: 1.55; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ── 頁籤與日期膠囊：同一個 sticky 區塊 ── */
  .top { position: sticky; top: 0; z-index: 30; background: var(--white); box-shadow: 0 2px 10px rgba(26,33,48,.08); }
  .tabs { display: flex; gap: 8px; padding: 10px 16px 0; background: var(--blue); padding-top: max(10px, env(safe-area-inset-top)); }
  .tab { flex: 1; padding: 10px 0 9px; border-radius: 12px 12px 0 0; font-size: 17px; font-weight: 700; letter-spacing: .1em;
         color: rgba(255,255,255,.9); background: rgba(255,255,255,.16); }
  .tab.on { background: var(--white); color: var(--blue); }
  .dates { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; scroll-behavior: smooth; }
  .dates::-webkit-scrollbar { display: none; }
  .chip { position: relative; flex: 0 0 auto; min-width: 66px; padding: 5px 10px 6px; border-radius: 12px; text-align: center;
          background: var(--gray-1); border: 1.5px solid var(--gray-2); }
  .chip .d { display: block; font-size: 16px; font-weight: 700; line-height: 1.25; }
  .chip .l { display: block; font-size: 11px; color: var(--gray-4); white-space: nowrap; }
  .chip.past { opacity: .5; }
  .chip.next::after { content: '下次'; position: absolute; top: -8px; right: -6px; padding: 0 6px; border-radius: 8px;
                      font-size: 10px; line-height: 16px; color: #fff; background: var(--orange); }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; opacity: 1; }
  .chip.on .l { color: rgba(255,255,255,.88); }

  main { max-width: 720px; margin: 0 auto; padding: 14px 16px 48px; }
  .card { background: var(--white); border: 1px solid var(--gray-2); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }

  /* ── 場次資訊卡 ── */
  .info { padding: 16px; }
  .info-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .when { font-size: 20px; font-weight: 800; }
  .type { display: inline-block; margin-top: 2px; padding: 1px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
          color: var(--blue-dk); background: var(--blue-lt); }
  .play-all { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px;
              font-size: 14px; font-weight: 600; color: var(--white); background: var(--blue); }
  .play-all.on { background: var(--blue-dk); }
  .kv { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; font-size: 15px; }
  .kv dt { color: var(--gray-4); font-size: 13px; padding-top: 2px; }
  .kv dd { font-weight: 500; white-space: pre-line; word-break: break-word; }
  .roster-toggle { display: flex; align-items: center; gap: 4px; margin-top: 12px; padding: 6px 0 0; width: 100%;
                   border-top: 1px dashed var(--gray-2); font-size: 14px; font-weight: 600; color: var(--blue); }
  .roster-toggle svg { transition: transform .2s; }
  .roster-toggle.open svg { transform: rotate(180deg); }
  .roster { margin-top: 8px; }
  .playlist { margin-top: 14px; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
  .playlist iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ── 歌曲卡 ── */
  .song-head { padding: 14px 16px 10px; }
  .tags { display: flex; gap: 6px; margin-bottom: 6px; }
  .tag { padding: 1px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-lt); }
  .tag.resp { color: var(--orange); background: var(--orange-lt); }
  .tag.key { color: var(--white); background: var(--black); }
  .song-head h3 { font-size: 19px; font-weight: 800; line-height: 1.35; }
  .src { font-size: 13px; color: var(--gray-4); }
  .media { position: relative; aspect-ratio: 16/9; background: #000; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
  .media .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
  .media .big span { width: 64px; height: 46px; border-radius: 12px; background: rgba(232,40,40,.92); display: flex; align-items: center; justify-content: center; }
  .media iframe, .media > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .media .msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
                padding: 16px; color: #fff; font-size: 14px; text-align: center; background: rgba(0,0,0,.75); }
  .media .msg a { color: #fff; font-weight: 700; padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,.18); text-decoration: none; }
  .linkbox { padding: 0 16px; }
  .linkbox a { display: block; padding: 10px; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 700; color: var(--blue); background: var(--blue-lt); text-decoration: none; }
  .ctrls { display: flex; gap: 8px; padding: 12px 16px 14px; }
  .btn { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; }
  .btn.ic { width: 44px; flex: 0 0 auto; color: var(--white); background: var(--blue); }
  .btn.ic.loop { background: var(--gray-2); color: var(--gray-4); }
  .btn.ic.loop.on { background: var(--blue); color: var(--white); }
  .btn.txt { flex: 1; color: var(--blue); background: var(--blue-lt); }
  .btn.txt.on { color: var(--white); background: var(--blue); }
  .btn.share { width: 44px; flex: 0 0 auto; color: var(--white); background: var(--green); }
  .btn:disabled { opacity: .4; cursor: default; }
  .lyrics { padding: 4px 18px 20px; font-size: 17px; line-height: 1.85; border-top: 1px solid var(--gray-2); }
  .lyrics .sec { display: inline-block; margin: 14px 0 2px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700;
                 line-height: 20px; color: var(--gray-4); background: var(--gray-1); letter-spacing: .04em; }
  .lyrics .gap { height: 10px; }

  .empty { padding: 28px 16px; text-align: center; color: var(--gray-4); font-size: 15px; }
  .empty pre { margin-top: 12px; text-align: left; white-space: pre-wrap; font: inherit; color: var(--black); }
  .err { padding: 40px 16px; text-align: center; }
  .err button { margin-top: 14px; padding: 10px 20px; border-radius: 10px; color: #fff; background: var(--blue); font-weight: 700; }
  .skel { height: 120px; margin-bottom: 14px; border-radius: var(--radius);
          background: linear-gradient(90deg, #e9edf2 25%, #f4f6f9 50%, #e9edf2 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .foot { text-align: center; font-size: 12px; color: var(--gray-3); }

  /* ── 歌譜檢視器 ── */
  .viewer { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: #111; }
  .vbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); color: #fff; background: #1d2430; }
  .vbar button, .vbar a { height: 38px; min-width: 38px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
                          color: #fff; background: rgba(255,255,255,.12); font-size: 14px; text-decoration: none; }
  .vbar button:disabled { opacity: .3; }
  .vtitle { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vtitle small { display: block; font-size: 11px; font-weight: 400; opacity: .7; }
  .viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .vempty { flex: 1; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 15px; padding: 24px; text-align: center; }
</style>
</head>
<body>

<div class="top">
  <nav class="tabs">
    <button class="tab" data-site="本堂">本堂</button>
    <button class="tab" data-site="新秀">新秀</button>
  </nav>
  <div class="dates" id="dates"></div>
</div>

<main id="main">
  <div class="skel"></div><div class="skel" style="height:300px"></div>
</main>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button id="vClose" aria-label="關閉">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button id="vPrev" aria-label="上一首">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="vtitle" id="vTitle"></div>
    <button id="vNext" aria-label="下一首">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <a id="vOpen" target="_blank" rel="noopener">開啟</a>
  </div>
  <iframe id="vFrame" allow="autoplay"></iframe>
  <div class="vempty" id="vEmpty" hidden>這首歌的歌譜尚未上傳</div>
</div>

<script>
/* ═════════════ 設定 ═════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxyV_3V66PKFx7n4284C17_kDQbBsjT8qptrG1uBMGBeo1ZwGbiqmXoEIymw6BMz9Q/exec';   // GAS 部署網址
const LIFF_ID = '2007843015-jGJQsDWB';                                // 有 LIFF ID 時填入，用於 LINE 分享
const SUNDAY_SWITCH_HOUR = 13;                     // 主日當天幾點後切換到下一週
const OTHER_SWITCH_HOUR = 22;                      // 非主日聚會當天幾點後視為結束
const SITE_PARAM = { main: '本堂', xinxiu: '新秀' };

/* ═════════════ 狀態 ═════════════ */
const S = { data: null, site: '本堂', date: null, view: [], players: {}, loop: new Set(), viewerIdx: -1 };
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['日', '一', '二', '三', '四', '五', '六'];

const ICON = {
  play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
  loop: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  share: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16c-.8 0-1.5.3-2 .8l-7.3-4.2c.1-.2.1-.4.1-.6s0-.4-.1-.6L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .4.1.6L7.8 9.8C7.3 9.3 6.6 9 5.8 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.3 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9S19.6 16 18 16z"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ═════════════ 日期工具 ═════════════ */
const toDate = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d); };
const isSunday = (ymd) => toDate(ymd).getDay() === 0;
const md = (ymd) => ymd.slice(5).replace('-', '/');
function endTime(s) {
  const d = toDate(s.date);
  d.setHours(isSunday(s.date) ? SUNDAY_SWITCH_HOUR : OTHER_SWITCH_HOUR, 0, 0, 0);
  return d;
}
/** 預設：尚未結束的下一個主日（主日當天聚會結束後才切下週） */
function defaultDate(list) {
  const now = new Date();
  const up = list.filter(s => endTime(s) > now);
  const pick = up.find(s => isSunday(s.date)) || up[0] || list[list.length - 1];
  return pick ? pick.date : null;
}
const shortLabel = (l) => (l || '').replace('教會禱告會', '禱告會').replace('宣教禱告會', '宣教禱告').replace('跨年禱告會', '跨年').slice(0, 5);

/* ═════════════ 資料 ═════════════ */
async function load() {
  try {
    let data = window.__WORSHIP_MOCK__;
    if (!data) {
      const res = await fetch(API_URL);
      data = await res.json();
    }
    if (data.error) throw new Error(data.error);
    S.data = data;
    initFromURL();
    render();
  } catch (e) {
    $('#main').innerHTML = `<div class="card err"><div>資料載入失敗</div><div class="src">${esc(e.message)}</div><button onclick="location.reload()">重新載入</button></div>`;
  }
}

function initFromURL() {
  const p = new URLSearchParams(location.search);
  const site = SITE_PARAM[p.get('site')] || p.get('site');
  if (site === '本堂' || site === '新秀') S.site = site;
  const list = S.data.sites[S.site] || [];
  const d = p.get('date');
  S.date = list.some(s => s.date === d) ? d : defaultDate(list);
}

function syncURL() {
  const key = Object.keys(SITE_PARAM).find(k => SITE_PARAM[k] === S.site);
  const p = new URLSearchParams({ site: key, date: S.date || '' });
  history.replaceState(null, '', location.pathname + '?' + p.toString());
}

/* ═════════════ 繪製 ═════════════ */
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.site === S.site));
  renderChips();
  renderService();
  syncURL();
}

function renderChips() {
  const list = S.data.sites[S.site] || [];
  const next = defaultDate(list);
  const now = new Date();
  const box = $('#dates');
  box.innerHTML = list.map(s => {
    const cls = ['chip', s.date === S.date ? 'on' : '', s.date === next ? 'next' : '', endTime(s) < now ? 'past' : ''].join(' ');
    const lbl = isSunday(s.date) && s.label === '主日' ? '主日' : `${shortLabel(s.label)}（${WD[toDate(s.date).getDay()]}）`;
    return `<button class="${cls}" data-date="${s.date}"><span class="d">${md(s.date)}</span><span class="l">${esc(lbl)}</span></button>`;
  }).join('');
  const on = $('.chip.on', box);
  if (on) {
    box.style.scrollBehavior = 'auto';
    box.scrollLeft = on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2;
    box.style.scrollBehavior = '';
  }
}

function currentService() {
  return (S.data.sites[S.site] || []).find(s => s.date === S.date);
}

function leaderNames(leader) {
  return String(leader || '').split(/[\n、,，/]/).map(n => n.replace(/[（(].*?[）)]/g, '').trim()).filter(Boolean);
}
function keyFor(song, leader) {
  if (!song || !song.keys) return '';
  for (const n of leaderNames(leader)) {
    for (const k in song.keys) if (k.startsWith(n) || n.startsWith(k)) return song.keys[k];
  }
  return '';
}
function ytId(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : '';
}

function renderService() {
  stopAll();
  const s = currentService();
  const main = $('#main');
  if (!s) { main.innerHTML = '<div class="card empty">這個堂點目前沒有排定的場次</div>'; return; }

  S.view = s.songs.map(it => {
    const info = S.data.songs[it.key] || {};
    const url = info.youtube || it.youtube || '';
    return {
      type: it.type, name: it.name,
      title: info.title || it.name, source: info.source || '',
      url, vid: ytId(url), lyrics: info.lyrics || '', sheet: info.sheet || null,
      key: keyFor(info, s.leader)
    };
  });

  const d = toDate(s.date);
  const rows = [['主領', s.leader], ['講員', s.speaker], ['團練', s.practice], ['聖餐', s.communion]]
    .filter(r => r[1]).map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('');
  const roster = Object.entries(s.roster || {}).filter(r => r[1])
    .map(r => `<dt>${esc(r[0].replace('禱告&報告', '禱告報告'))}</dt><dd>${esc(r[1])}</dd>`).join('');
  const vids = S.view.map(v => v.vid).filter(Boolean);
  const rosterOpen = readPref('rosterOpen') === '1';

  let html = `
  <section class="card info">
    <div class="info-top">
      <div>
        <div class="when">${md(s.date)}（${WD[d.getDay()]}）</div>
        <span class="type">${esc(S.site)}｜${esc(s.label)}</span>
      </div>
      ${vids.length > 1 ? `<button class="play-all" id="playAll">${ICON.play}連續播放</button>` : ''}
    </div>
    <dl class="kv">${rows}</dl>
    ${roster ? `<button class="roster-toggle ${rosterOpen ? 'open' : ''}" id="rosterBtn">服事名單 ${ICON.chev}</button>
    <dl class="kv roster" id="roster" ${rosterOpen ? '' : 'hidden'}>${roster}</dl>` : ''}
    <div class="playlist" id="playlist" hidden></div>
  </section>`;

  if (!S.view.length) {
    html += `<div class="card empty">歌單尚未公布${s.rawSetlist ? `<pre>${esc(s.rawSetlist)}</pre>` : ''}</div>`;
  } else {
    let n = 0;
    html += S.view.map((v, i) => {
      const tag = v.type === 'response' ? '<span class="tag resp">回應</span>' : `<span class="tag">敬拜 ${++n}</span>`;
      const media = v.vid
        ? `<div class="media" id="media-${i}"><img loading="lazy" src="https://i.ytimg.com/vi/${v.vid}/hqdefault.jpg" alt=""><button class="big" data-act="play" data-i="${i}" aria-label="播放"><span>${ICON.play.replace('currentColor', '#fff')}</span></button></div>`
        : (v.url ? `<div class="linkbox"><a href="${esc(v.url)}" target="_blank" rel="noopener">開啟參考連結</a></div>` : '');
      return `
      <section class="card song" id="song-${i}">
        <div class="song-head">
          <div class="tags">${tag}${v.key ? `<span class="tag key">${esc(v.key)} 調</span>` : ''}</div>
          <h3>${esc(v.title)}</h3>
          ${v.source ? `<div class="src">${esc(v.source)}</div>` : ''}
        </div>
        ${media}
        <div class="ctrls">
          <button class="btn ic" data-act="toggle" data-i="${i}" ${v.vid ? '' : 'disabled'} aria-label="播放或暫停">${ICON.play}</button>
          <button class="btn ic loop" data-act="loop" data-i="${i}" ${v.vid ? '' : 'disabled'} aria-label="單曲循環">${ICON.loop}</button>
          <button class="btn txt" data-act="lyrics" data-i="${i}" ${v.lyrics ? '' : 'disabled'}>${v.lyrics ? '歌詞' : '無歌詞'}</button>
          <button class="btn txt" data-act="sheet" data-i="${i}">${v.sheet ? '歌譜' : '無歌譜'}</button>
          <button class="btn share" data-act="share" data-i="${i}" ${v.lyrics ? '' : 'disabled'} aria-label="分享歌詞">${ICON.share}</button>
        </div>
        <div class="lyrics" id="lyr-${i}" hidden></div>
      </section>`;
    }).join('');
  }
  if (S.data.updated) html += `<p class="foot">資料更新：${esc(S.data.updated.replace('T', ' ').slice(0, 16))}</p>`;
  main.innerHTML = html;
}

/* ═════════════ 歌詞 ═════════════ */
const LABEL_RE = /^\[?\(?\s*(intro|intor|verse|pre[\s-]*chorus|prechrous|chorus|choruse|chrous|chours|chorsu|bridge|brige|ending|endting|inter|interlude|outro|tag|rap|a\d|b|c)\s*\d*\s*\)?\]?$/i;
function lyricLines(raw) {
  const lines = String(raw || '').split(/\r?\n/).map(l => l.trim());
  const firstLabel = lines.findIndex(l => LABEL_RE.test(l));
  const start = firstLabel > -1 ? firstLabel : 0;     // 第一個段落標籤前的作者、版權資訊略過
  return lines.slice(start).filter(l => !/^blank$/i.test(l) && !/^[【〖].*[】〗]$/.test(l));
}
function lyricsHTML(raw) {
  let out = '', gap = false;
  lyricLines(raw).forEach(l => {
    if (!l) { if (!gap && out) { out += '<div class="gap"></div>'; gap = true; } return; }
    gap = false;
    out += LABEL_RE.test(l) ? `<span class="sec">${esc(l.replace(/[\[\]()]/g, ''))}</span><br>` : `${esc(l)}<br>`;
  });
  return out;
}
function lyricsPlain(raw) {
  return lyricLines(raw).filter(l => !LABEL_RE.test(l)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ═════════════ YouTube ═════════════ */
let ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytReady;
}
async function play(i) {
  const v = S.view[i];
  if (!v || !v.vid) return;
  stopPlaylist();
  pauseOthers(i);
  const p = S.players[i];
  if (p && p.playVideo) { p.playVideo(); return; }
  await loadYT();
  const holder = $('#media-' + i);
  holder.innerHTML = '<div></div>';
  S.players[i] = new YT.Player(holder.firstChild, {
    videoId: v.vid,
    playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
    events: {
      onReady: e => e.target.playVideo(),
      onStateChange: e => onState(i, e),
      onError: () => {
        holder.insertAdjacentHTML('beforeend', `<div class="msg">此影片無法在頁面內播放<a href="https://youtu.be/${v.vid}" target="_blank" rel="noopener">到 YouTube 觀看</a></div>`);
      }
    }
  });
}
function onState(i, e) {
  const btn = $(`[data-act="toggle"][data-i="${i}"]`);
  if (e.data === YT.PlayerState.PLAYING) { pauseOthers(i); if (btn) btn.innerHTML = ICON.pause; }
  if (e.data === YT.PlayerState.PAUSED && btn) btn.innerHTML = ICON.play;
  if (e.data === YT.PlayerState.ENDED) {
    if (S.loop.has(i)) { e.target.seekTo(0); e.target.playVideo(); }
    else if (btn) btn.innerHTML = ICON.play;
  }
}
function pauseOthers(i) {
  Object.entries(S.players).forEach(([k, p]) => { if (+k !== i && p.pauseVideo) p.pauseVideo(); });
}
function stopAll() {
  Object.values(S.players).forEach(p => { try { p.destroy(); } catch (e) {} });
  S.players = {}; S.loop.clear();
}
function togglePlaylist() {
  const box = $('#playlist'), btn = $('#playAll');
  if (!box.hidden) { stopPlaylist(); return; }
  Object.values(S.players).forEach(p => p.pauseVideo && p.pauseVideo());
  const ids = S.view.map(v => v.vid).filter(Boolean);
  box.innerHTML = `<iframe src="https://www.youtube.com/embed/${ids[0]}?autoplay=1&playsinline=1&rel=0&playlist=${ids.slice(1).join(',')}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  box.hidden = false;
  btn.classList.add('on'); btn.innerHTML = ICON.pause + '停止播放';
}
function stopPlaylist() {
  const box = $('#playlist'), btn = $('#playAll');
  if (!box || box.hidden) return;
  box.innerHTML = ''; box.hidden = true;
  if (btn) { btn.classList.remove('on'); btn.innerHTML = ICON.play + '連續播放'; }
}

/* ═════════════ 歌譜檢視器 ═════════════ */
function openViewer(i) {
  S.viewerIdx = i;
  const v = S.view[i];
  $('#vTitle').innerHTML = `${esc(v.title)}${v.key ? `<small>${esc(v.key)} 調・${i + 1} / ${S.view.length}</small>` : `<small>${i + 1} / ${S.view.length}</small>`}`;
  $('#vPrev').disabled = i === 0;
  $('#vNext').disabled = i === S.view.length - 1;
  const frame = $('#vFrame'), empty = $('#vEmpty'), open = $('#vOpen');
  const sh = v.sheet;
  if (sh && sh.driveId) {
    frame.src = `https://drive.google.com/file/d/${sh.driveId}/preview`;
    frame.hidden = false; empty.hidden = true;
    open.href = sh.url; open.hidden = false;
  } else if (sh && sh.url) {
    frame.removeAttribute('src'); frame.hidden = true;
    empty.hidden = false; empty.textContent = '此歌譜需在新視窗開啟';
    open.href = sh.url; open.hidden = false;
  } else {
    frame.removeAttribute('src'); frame.hidden = true;
    empty.hidden = false; empty.textContent = '這首歌的歌譜尚未上傳';
    open.hidden = true;
  }
  $('#viewer').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeViewer() {
  $('#viewer').hidden = true;
  $('#vFrame').removeAttribute('src');
  document.body.style.overflow = '';
}

/* ═════════════ 分享 ═════════════ */
async function share(i) {
  const v = S.view[i];
  const text = `${v.title}${v.source ? '（' + v.source + '）' : ''}\n\n${lyricsPlain(v.lyrics)}`;
  if (window.liff && liff.isInClient && liff.isInClient() && liff.isApiAvailable('shareTargetPicker')) {
    try { await liff.shareTargetPicker([{ type: 'text', text }]); } catch (e) {}
    return;
  }
  if (navigator.share) { try { await navigator.share({ text }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(text); alert('歌詞已複製'); } catch (e) { alert('無法複製，請手動選取歌詞'); }
}

/* ═════════════ 偏好（僅存在本機） ═════════════ */
function readPref(k) { try { return localStorage.getItem('wt_' + k); } catch (e) { return null; } }
function writePref(k, v) { try { localStorage.setItem('wt_' + k, v); } catch (e) {} }

/* ═════════════ 事件 ═════════════ */
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t || !S.data || t.dataset.site === S.site) return;
  S.site = t.dataset.site;
  const list = S.data.sites[S.site] || [];
  if (!list.some(s => s.date === S.date)) S.date = defaultDate(list);   // 同一天就保留，方便兩堂比對
  render();
});

$('#dates').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c || c.dataset.date === S.date) return;
  S.date = c.dataset.date;
  render();
  window.scrollTo({ top: 0 });
});

$('#main').addEventListener('click', e => {
  if (e.target.closest('#playAll')) return togglePlaylist();
  if (e.target.closest('#rosterBtn')) {
    const btn = $('#rosterBtn'), box = $('#roster');
    box.hidden = !box.hidden; btn.classList.toggle('open', !box.hidden);
    writePref('rosterOpen', box.hidden ? '0' : '1');
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const i = +b.dataset.i;
  switch (b.dataset.act) {
    case 'play': play(i); break;
    case 'toggle': {
      const p = S.players[i];
      if (p && p.getPlayerState && p.getPlayerState() === YT.PlayerState.PLAYING) p.pauseVideo();
      else play(i);
      break;
    }
    case 'loop':
      S.loop.has(i) ? S.loop.delete(i) : S.loop.add(i);
      b.classList.toggle('on', S.loop.has(i));
      break;
    case 'lyrics': {
      const box = $('#lyr-' + i);
      if (!box.innerHTML) box.innerHTML = lyricsHTML(S.view[i].lyrics);
      box.hidden = !box.hidden;
      b.classList.toggle('on', !box.hidden);
      b.textContent = box.hidden ? '歌詞' : '收合';
      break;
    }
    case 'sheet': openViewer(i); break;
    case 'share': share(i); break;
  }
});

$('#vClose').addEventListener('click', closeViewer);
$('#vPrev').addEventListener('click', () => S.viewerIdx > 0 && openViewer(S.viewerIdx - 1));
$('#vNext').addEventListener('click', () => S.viewerIdx < S.view.length - 1 && openViewer(S.viewerIdx + 1));

/* ═════════════ 啟動 ═════════════ */
if (LIFF_ID) {
  const s = document.createElement('script');
  s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  s.onload = () => liff.init({ liffId: LIFF_ID }).catch(() => {});
  document.head.appendChild(s);
}
load();
</script>
</body>
