<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>敬拜同工查詢｜花蓮靈糧堂</title>
<!-- 提早建立連線，縮短第一次取資料的時間 -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://i.ytimg.com">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #2E7EE8; --blue-dk: #1A5CBF; --blue-lt: #EBF2FD;
    --orange: #E8892E; --orange-lt: #FDF1E4;
    --green: #06C755;
    --gray-1: #F4F6F9; --gray-2: #E3E8EE; --gray-3: #B0BAC6; --gray-4: #6B7A8D;
    --black: #1A2130; --white: #FFFFFF;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--font); background: var(--gray-1); color: var(--black); line-height: 1.55; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ── 頁籤與日期膠囊：同一個 sticky 區塊 ── */
  .top { position: sticky; top: 0; z-index: 30; background: var(--white); box-shadow: 0 2px 10px rgba(26,33,48,.08); }
  .tabs { display: flex; gap: 8px; padding: 10px 16px 0; background: var(--blue); padding-top: max(10px, env(safe-area-inset-top)); }
  .tab { flex: 1; padding: 10px 0 9px; border-radius: 12px 12px 0 0; font-size: 17px; font-weight: 700; letter-spacing: .1em;
         color: rgba(255,255,255,.9); background: rgba(255,255,255,.16); }
  .tab.on { background: var(--white); color: var(--blue); }
  .dates { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; scroll-behavior: smooth; }
  .dates::-webkit-scrollbar { display: none; }
  .chip { position: relative; flex: 0 0 auto; min-width: 66px; padding: 5px 10px 6px; border-radius: 12px; text-align: center;
          background: var(--gray-1); border: 1.5px solid var(--gray-2); }
  .chip .d { display: block; font-size: 16px; font-weight: 700; line-height: 1.25; }
  .chip .l { display: block; font-size: 11px; color: var(--gray-4); white-space: nowrap; }
  .chip.past { opacity: .5; }
  .chip.next::after { content: '下次'; position: absolute; top: -8px; right: -6px; padding: 0 6px; border-radius: 8px;
                      font-size: 10px; line-height: 16px; color: #fff; background: var(--orange); }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; opacity: 1; }
  .chip.on .l { color: rgba(255,255,255,.88); }

  main { max-width: 720px; margin: 0 auto; padding: 14px 16px 48px; }
  .card { background: var(--white); border: 1px solid var(--gray-2); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }

  /* ── 場次資訊卡 ── */
  .info { padding: 16px; }
  .info-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .when { font-size: 20px; font-weight: 800; }
  .type { display: inline-block; margin-top: 2px; padding: 1px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
          color: var(--blue-dk); background: var(--blue-lt); }
  .report-btn { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 10px;
                font-size: 13px; font-weight: 600; color: var(--gray-4); background: var(--gray-1); border: 1px solid var(--gray-2); }
  .kv { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; font-size: 15px; }
  .kv dt { color: var(--gray-4); font-size: 13px; padding-top: 2px; }
  .kv dd { font-weight: 500; white-space: pre-line; word-break: break-word; }
  .roster-toggle { display: flex; align-items: center; gap: 4px; margin-top: 12px; padding: 6px 0 0; width: 100%;
                   border-top: 1px dashed var(--gray-2); font-size: 14px; font-weight: 600; color: var(--blue); }
  .roster-toggle svg { transition: transform .2s; }
  .roster-toggle.open svg { transform: rotate(180deg); }
  .roster { margin-top: 8px; }
  /* ── 連續播放 ── */
  .pl-bar { display: flex; gap: 8px; margin-top: 14px; }
  .play-all { flex: 1; height: 42px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px;
              font-size: 15px; font-weight: 700; color: var(--white); background: var(--blue); }
  .play-all.on { background: var(--blue-dk); }
  .pl-loop { flex: 0 0 auto; height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 10px;
             font-size: 14px; font-weight: 700; color: var(--gray-4); background: var(--gray-2); }
  .pl-loop.on { color: var(--white); background: var(--blue); }
  .playlist { margin-top: 12px; }
  .pl-video { position: relative; border-radius: 10px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
  .pl-video > div, .pl-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .pl-list { list-style: none; margin-top: 6px; }
  .pl-list li { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--gray-2); font-size: 15px; cursor: pointer; }
  .pl-list li:last-child { border-bottom: 0; }
  .pl-list .no { width: 22px; height: 22px; flex: 0 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                 font-size: 12px; font-weight: 700; color: var(--gray-4); background: var(--gray-1); }
  .pl-list .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-list li.cur { color: var(--blue); font-weight: 700; }
  .pl-list li.cur .no { color: var(--white); background: var(--blue); }
  .pl-list li.bad .t { color: var(--gray-3); }
  .pl-list .yt { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--orange); text-decoration: none; }
  .pl-msg { margin-top: 6px; font-size: 12px; color: var(--gray-4); }

  /* ── 問題回報 ── */
  .mask { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; background: rgba(15,20,30,.45); }
  .sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 18px 16px;
           padding-bottom: max(18px, env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0; background: var(--white); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; font-size: 18px; font-weight: 800; }
  .sheet-head button { width: 34px; height: 34px; border-radius: 50%; background: var(--gray-1); font-size: 20px; line-height: 1; color: var(--gray-4); }
  .ctx { margin-bottom: 14px; font-size: 13px; color: var(--gray-4); }
  .field { margin-bottom: 14px; }
  .field > label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--gray-4); }
  .rtypes { display: flex; flex-wrap: wrap; gap: 8px; }
  .rtypes button { padding: 6px 12px; border-radius: 16px; font-size: 14px; border: 1.5px solid var(--gray-2); background: var(--white); }
  .rtypes button.on { color: var(--white); background: var(--blue); border-color: var(--blue); }
  .field select, .field textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--gray-2);
                                   font: inherit; font-size: 16px; color: var(--black); background: var(--white); }
  .field textarea { resize: vertical; min-height: 110px; }
  .hint { margin-bottom: 12px; font-size: 12px; color: var(--gray-4); }
  .submit { width: 100%; height: 48px; border-radius: 12px; font-size: 16px; font-weight: 800; color: var(--white); background: var(--blue); }
  .submit:disabled { opacity: .5; }
  .foot-report { display: block; margin: 4px auto 12px; padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700;
                 color: var(--gray-4); background: var(--white); border: 1px solid var(--gray-2); }
  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 80; transform: translateX(-50%);
           padding: 10px 18px; border-radius: 20px; font-size: 14px; color: var(--white); background: rgba(26,33,48,.92); white-space: nowrap; }

  /* ── 歌曲卡 ── */
  .song-head { padding: 14px 16px 10px; }
  .tags { display: flex; gap: 6px; margin-bottom: 6px; }
  .tag { padding: 1px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--blue); background: var(--blue-lt); }
  .tag.resp { color: var(--orange); background: var(--orange-lt); }
  .tag.key { color: var(--white); background: var(--black); }
  .song-head h3 { font-size: 19px; font-weight: 800; line-height: 1.35; }
  .src { font-size: 13px; color: var(--gray-4); }
  .media { position: relative; aspect-ratio: 16/9; background: #000; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
  .media .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
  .media .big span { width: 64px; height: 46px; border-radius: 12px; background: rgba(232,40,40,.92); display: flex; align-items: center; justify-content: center; }
  .media iframe, .media > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .media .msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
                padding: 16px; color: #fff; font-size: 14px; text-align: center; background: rgba(0,0,0,.75); }
  .media .msg a { color: #fff; font-weight: 700; padding: 6px 14px; border-radius: 8px; background: rgba(255,255,255,.18); text-decoration: none; }
  .linkbox { padding: 0 16px; }
  .linkbox a { display: block; padding: 10px; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 700; color: var(--blue); background: var(--blue-lt); text-decoration: none; }
  .ctrls { display: flex; gap: 8px; padding: 12px 16px 14px; }
  .btn { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 700; }
  .btn.ic { width: 44px; flex: 0 0 auto; color: var(--white); background: var(--blue); }
  .btn.ic.loop { background: var(--gray-2); color: var(--gray-4); }
  .btn.ic.loop.on { background: var(--blue); color: var(--white); }
  .btn.txt { flex: 1; color: var(--blue); background: var(--blue-lt); }
  .btn.txt.on { color: var(--white); background: var(--blue); }
  .btn.share { width: 44px; flex: 0 0 auto; color: var(--white); background: var(--green); }
  .btn:disabled { opacity: .4; cursor: default; }
  .lyrics { padding: 4px 18px 20px; font-size: 17px; line-height: 1.85; border-top: 1px solid var(--gray-2); }
  .lyrics .sec { display: inline-block; margin: 14px 0 2px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700;
                 line-height: 20px; color: var(--gray-4); background: var(--gray-1); letter-spacing: .04em; }
  .lyrics .gap { height: 10px; }

  .empty { padding: 28px 16px; text-align: center; color: var(--gray-4); font-size: 15px; }
  .empty pre { margin-top: 12px; text-align: left; white-space: pre-wrap; font: inherit; color: var(--black); }
  .err { padding: 40px 16px; text-align: center; }
  .err button { margin-top: 14px; padding: 10px 20px; border-radius: 10px; color: #fff; background: var(--blue); font-weight: 700; }
  .skel { height: 120px; margin-bottom: 14px; border-radius: var(--radius);
          background: linear-gradient(90deg, #e9edf2 25%, #f4f6f9 50%, #e9edf2 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .foot { text-align: center; font-size: 12px; color: var(--gray-3); }

  /* ── 歌譜檢視器 ── */
  .viewer { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; background: #111; }
  .vbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); color: #fff; background: #1d2430; }
  .vbar button, .vbar a { height: 38px; min-width: 38px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
                          color: #fff; background: rgba(255,255,255,.12); font-size: 14px; text-decoration: none; }
  .vbar button:disabled { opacity: .3; }
  .vtitle { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vtitle small { display: block; font-size: 11px; font-weight: 400; opacity: .7; }
  .viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .vempty { flex: 1; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 15px; padding: 24px; text-align: center; }
</style>
</head>
<body>

<div class="top">
  <nav class="tabs">
    <button class="tab" data-site="本堂">本堂</button>
    <button class="tab" data-site="新秀">新秀</button>
  </nav>
  <div class="dates" id="dates"></div>
</div>

<main id="main">
  <div class="skel"></div><div class="skel" style="height:300px"></div>
</main>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button id="vClose" aria-label="關閉">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button id="vPrev" aria-label="上一首">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="vtitle" id="vTitle"></div>
    <button id="vNext" aria-label="下一首">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <a id="vOpen" target="_blank" rel="noopener">開啟</a>
  </div>
  <iframe id="vFrame" allow="autoplay"></iframe>
  <div class="vempty" id="vEmpty" hidden>這首歌的歌譜尚未上傳</div>
</div>

<div class="mask" id="report" hidden>
  <form class="sheet" id="reportForm" autocomplete="off">
    <div class="sheet-head">問題回報<button type="button" id="rClose" aria-label="關閉">×</button></div>
    <div class="ctx" id="rCtx"></div>
    <div class="field">
      <label>問題類型</label>
      <div class="rtypes" id="rType">
        <button type="button" class="on">歌詞錯誤</button>
        <button type="button">歌譜問題</button>
        <button type="button">影片無法播放</button>
        <button type="button">排班資料</button>
        <button type="button">頁面操作</button>
        <button type="button">其他</button>
      </div>
    </div>
    <div class="field">
      <label for="rSong">相關歌曲</label>
      <select id="rSong"></select>
    </div>
    <div class="field">
      <label for="rText">說明</label>
      <textarea id="rText" maxlength="500" placeholder="例如：第二段副歌少了一句"></textarea>
    </div>
    <p class="hint" id="rHint"></p>
    <button class="submit" type="submit" id="rSubmit">送出</button>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ═════════════ 設定 ═════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxyV_3V66PKFx7n4284C17_kDQbBsjT8qptrG1uBMGBeo1ZwGbiqmXoEIymw6BMz9Q/exec';   // GAS 部署網址
const LIFF_ID = '2007843015-jGJQsDWB';                                // 有 LIFF ID 時填入：LINE 分享、問題回報傳到官方帳號聊天室
const SUNDAY_SWITCH_HOUR = 13;                     // 主日當天幾點後切換到下一週
const OTHER_SWITCH_HOUR = 22;                      // 非主日聚會當天幾點後視為結束
const SITE_PARAM = { main: '本堂', xinxiu: '新秀' };

/* ═════════════ 狀態 ═════════════ */
const S = { data: null, site: '本堂', date: null, view: [], players: {}, loop: new Set(), viewerIdx: -1 };
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['日', '一', '二', '三', '四', '五', '六'];

const ICON = {
  play: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
  loop: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  share: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16c-.8 0-1.5.3-2 .8l-7.3-4.2c.1-.2.1-.4.1-.6s0-.4-.1-.6L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .4.1.6L7.8 9.8C7.3 9.3 6.6 9 5.8 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.3 4.2c-.1.2-.1.4-.1.6 0 1.6 1.3 2.9 2.9 2.9s2.9-1.3 2.9-2.9S19.6 16 18 16z"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  report: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v4M12 14h.01"/></svg>'
};

/* ═════════════ 日期工具 ═════════════ */
const toDate = (ymd) => { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d); };
const isSunday = (ymd) => toDate(ymd).getDay() === 0;
const md = (ymd) => ymd.slice(5).replace('-', '/');
function endTime(s) {
  const d = toDate(s.date);
  d.setHours(isSunday(s.date) ? SUNDAY_SWITCH_HOUR : OTHER_SWITCH_HOUR, 0, 0, 0);
  return d;
}
/** 預設：尚未結束的下一個主日（主日當天聚會結束後才切下週） */
function defaultDate(list) {
  const now = new Date();
  const up = list.filter(s => endTime(s) > now);
  const pick = up.find(s => isSunday(s.date)) || up[0] || list[list.length - 1];
  return pick ? pick.date : null;
}
const shortLabel = (l) => (l || '').replace('教會禱告會', '禱告會').replace('宣教禱告會', '宣教禱告').replace('跨年禱告會', '跨年').slice(0, 5);

/* ═════════════ 資料 ═════════════ */
/**
 * 載入策略（先顯示、後更新）
 * 1. 有上次存在手機的資料 → 立即顯示（不到 1 秒）
 * 2. 同時向 GAS 取最新資料 → 內容有變才重新繪製
 */
const STORE_KEY = 'wt_data_v1';
function readStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; } }
function writeStore(d) { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); } catch (e) {} }

function fetchFresh() {
  if (window.__WORSHIP_MOCK__) return Promise.resolve(window.__WORSHIP_MOCK__);
  return fetch(API_URL).then(r => r.json()).then(d => { if (d.error) throw new Error(d.error); return d; });
}

async function load(freshPromise) {
  const cached = readStore();
  if (cached && cached.sites) {
    S.data = cached;
    initFromURL();
    render();
  }
  try {
    const fresh = await freshPromise;
    writeStore(fresh);
    if (!S.data) {                              // 第一次開啟，沒有本機資料
      S.data = fresh; initFromURL(); render();
    } else if (fresh.ver !== S.data.ver || !fresh.ver) {
      applyFresh(fresh);
    } else {
      S.data.updated = fresh.updated;
    }
  } catch (e) {
    if (!S.data) {
      $('#main').innerHTML = `<div class="card err"><div>資料載入失敗</div><div class="src">${esc(e.message)}</div><button onclick="location.reload()">重新載入</button></div>`;
    } else {
      toast('目前顯示上次的資料，網路恢復後會自動更新');
    }
  }
}

/** 新資料到達：沒在播放或操作時直接更新畫面；否則先存著，切換場次時套用 */
function applyFresh(fresh) {
  S.data = fresh;
  const list = S.data.sites[S.site] || [];
  if (!list.some(s => s.date === S.date)) S.date = defaultDate(list);
  const busy = !$('#viewer').hidden || !$('#report').hidden || !!PL.player || Object.keys(S.players).length > 0
    || !!document.querySelector('.lyrics:not([hidden])');
  if (busy) { toast('資料已更新，切換場次後套用'); return; }

  window.scrollTo(0, y);
}

function leaderNames(leader) {
  return String(leader || '').split(/[\n、,，/]/).map(n => n.replace(/[（(].*?[）)]/g, '').trim()).filter(Boolean);
}
function keyFor(song, leader) {
  if (!song || !song.keys) return '';
  for (const n of leaderNames(leader)) {
    for (const k in song.keys) if (k.startsWith(n) || n.startsWith(k)) return song.keys[k];
  }
  return '';
}
function ytId(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : '';
}

/* ═════════════ 歌詞 ═════════════ */
const LABEL_RE = /^\[?\(?\s*(intro|intor|verse|pre[\s-]*chorus|prechrous|chorus|choruse|chrous|chours|chorsu|bridge|brige|ending|endting|inter|interlude|outro|tag|rap|a\d|b|c)\s*\d*\s*\)?\]?$/i;
function lyricLines(raw) {
  const lines = String(raw || '').split(/\r?\n/).map(l => l.trim());
  const firstLabel = lines.findIndex(l => LABEL_RE.test(l));
  const start = firstLabel > -1 ? firstLabel : 0;     // 第一個段落標籤前的作者、版權資訊略過
  return lines.slice(start).filter(l => !/^blank$/i.test(l) && !/^[【〖].*[】〗]$/.test(l));
}
function lyricsHTML(raw) {
  let out = '', gap = false;
  lyricLines(raw).forEach(l => {
    if (!l) { if (!gap && out) { out += '<div class="gap"></div>'; gap = true; } return; }
    gap = false;
    out += LABEL_RE.test(l) ? `<span class="sec">${esc(l.replace(/[\[\]()]/g, ''))}</span><br>` : `${esc(l)}<br>`;
  });
  return out;
}
function lyricsPlain(raw) {
  return lyricLines(raw).filter(l => !LABEL_RE.test(l)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ═════════════ YouTube ═════════════ */
let ytReady = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytReady;
}
async function play(i) {
  const v = S.view[i];
  if (!v || !v.vid) return;
  pausePlaylist();
  pauseOthers(i);
  const p = S.players[i];
  if (p && p.playVideo) { p.playVideo(); return; }
  await loadYT();
  const holder = $('#media-' + i);
  holder.innerHTML = '<div></div>';
  S.players[i] = new YT.Player(holder.firstChild, {
    videoId: v.vid,
    playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
    events: {
      onReady: e => e.target.playVideo(),
      onStateChange: e => onState(i, e),
      onError: () => {
        holder.insertAdjacentHTML('beforeend', `<div class="msg">此影片無法在頁面內播放<a href="https://youtu.be/${v.vid}" target="_blank" rel="noopener">到 YouTube 觀看</a></div>`);
      }
    }
  });
}
function onState(i, e) {
  const btn = $(`[data-act="toggle"][data-i="${i}"]`);
  if (e.data === YT.PlayerState.PLAYING) { pauseOthers(i); pausePlaylist(); if (btn) btn.innerHTML = ICON.pause; }
  if (e.data === YT.PlayerState.PAUSED && btn) btn.innerHTML = ICON.play;
  if (e.data === YT.PlayerState.ENDED) {
    if (S.loop.has(i)) { e.target.seekTo(0); e.target.playVideo(); }
    else if (btn) btn.innerHTML = ICON.play;
  }
}
function pauseOthers(i) {
  Object.entries(S.players).forEach(([k, p]) => { if (+k !== i && p.pauseVideo) p.pauseVideo(); });
}
function stopAll() {
  Object.values(S.players).forEach(p => { try { p.destroy(); } catch (e) {} });
  S.players = {}; S.loop.clear();
  stopPlaylist();
}

/* ═════════════ 連續播放（自行管理佇列，遇到禁止嵌入的影片自動跳過） ═════════════ */
const PL = { player: null, ready: false, queue: [], pos: -1, fails: 0, bad: new Set(), loop: readPref('plLoop') === '1' };

function startPlaylist(pos = 0) {
  Object.values(S.players).forEach(p => p.pauseVideo && p.pauseVideo());
  PL.queue = S.view.map((v, i) => (v.vid ? i : -1)).filter(i => i > -1);
  if (!PL.queue.length) return;
  PL.fails = 0;
  $('#plMsg').hidden = true;
  $('#playlist').hidden = false;
  const btn = $('#playAll');
  btn.classList.add('on'); btn.innerHTML = ICON.pause + '停止播放';
  plGo(pos);
}
async function plGo(pos) {
  PL.pos = pos;
  renderPlList();
  const vid = S.view[PL.queue[pos]].vid;
  if (PL.player && PL.ready) { PL.player.loadVideoById(vid); return; }
  if (PL.player) return;                                   // 播放器建立中，onReady 會載入目前這首
  await loadYT();
  if ($('#playlist').hidden) return;
  $('#plVideo').innerHTML = '<div></div>';
  PL.player = new YT.Player($('#plVideo').firstChild, {
    videoId: vid,
    playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
    events: {
      onReady: e => {
        PL.ready = true;
        const cur = S.view[PL.queue[PL.pos]].vid;
        if (e.target.getVideoData && e.target.getVideoData().video_id !== cur) e.target.loadVideoById(cur);
        else e.target.playVideo();
      },
      onStateChange: plState,
      onError: plError
    }
  });
}
function plNext() {
  let p = PL.pos;
  for (let step = 0; step < PL.queue.length; step++) {
    p++;
    if (p >= PL.queue.length) {
      if (!PL.loop) { plMsg('清單播放完畢'); finishPlaylist(); return; }
      p = 0;
    }
    if (!PL.bad.has(PL.queue[p])) { plGo(p); return; }   // 已知無法播放的影片直接跳過
  }
  plMsg('清單中的影片都無法在頁面內播放'); finishPlaylist();
}
function plState(e) {
  if (e.data === YT.PlayerState.PLAYING) {
    PL.fails = 0;
    Object.values(S.players).forEach(p => p.pauseVideo && p.pauseVideo());
  }
  if (e.data === YT.PlayerState.ENDED) plNext();
}
function plError() {
  PL.bad.add(PL.queue[PL.pos]);
  PL.fails++;
  if (PL.fails >= PL.queue.length) { plMsg('清單中的影片都無法在頁面內播放'); finishPlaylist(); return; }
  plMsg('已略過無法在頁面內播放的影片');
  plNext();
}
function plMsg(t) { const m = $('#plMsg'); if (m) { m.textContent = t; m.hidden = false; } }
function renderPlList() {
  const ol = $('#plList');
  if (!ol) return;
  ol.innerHTML = PL.queue.map((idx, p) => {
    const v = S.view[idx], bad = PL.bad.has(idx);
    return `<li class="${p === PL.pos ? 'cur' : ''} ${bad ? 'bad' : ''}" data-pl="${p}">
      <span class="no">${p + 1}</span><span class="t">${esc(v.title)}${v.type === 'response' ? '（回應）' : ''}</span>
      ${bad ? `<a class="yt" href="https://youtu.be/${v.vid}" target="_blank" rel="noopener">到 YouTube 聽</a>` : ''}</li>`;
  }).join('');
}
function pausePlaylist() { if (PL.player && PL.ready && PL.player.pauseVideo) PL.player.pauseVideo(); }
/** 播完或全部失敗：保留清單畫面，按鈕回到可重新播放 */
function finishPlaylist() {
  PL.pos = -1; renderPlList();
  const btn = $('#playAll');
  if (btn) { btn.classList.remove('on'); btn.innerHTML = ICON.play + '連續播放'; }
}
function stopPlaylist() {
  if (PL.player) { try { PL.player.destroy(); } catch (e) {} }
  PL.player = null; PL.ready = false; PL.pos = -1; PL.fails = 0; PL.bad.clear();
  const box = $('#playlist'), btn = $('#playAll');
  if (box) { box.hidden = true; $('#plVideo').innerHTML = ''; $('#plMsg').hidden = true; }
  if (btn) { btn.classList.remove('on'); btn.innerHTML = ICON.play + '連續播放'; }
}

/* ═════════════ 分享 ═════════════ */
async function share(i) {
  const v = S.view[i];
  const link = v.vid ? `https://youtu.be/${v.vid}` : v.url;      // 去掉 ?si= 追蹤參數
  const text = [
    `${v.title}${v.source ? '（' + v.source + '）' : ''}`,
    link,
    v.lyrics ? '\n' + lyricsPlain(v.lyrics) : ''
  ].filter(Boolean).join('\n');
  if (inLINE() && liff.isApiAvailable('shareTargetPicker')) {
    try { await liff.shareTargetPicker([{ type: 'text', text }]); } catch (e) {}
    return;
  }
  if (navigator.share) { try { await navigator.share({ text }); } catch (e) {} return; }
  try { await navigator.clipboard.writeText(text); toast('已複製，可貼到聊天室'); } catch (e) { alert('無法複製，請手動選取歌詞'); }
}

/* ═════════════ LINE ═════════════ */
let liffOK = false;                                    // liff.init 成功後才使用 LINE 功能
function inLINE() { return liffOK && liff.isInClient(); }
/** 只在「與官方帳號的一對一聊天室」開啟時，才把回報傳進聊天室，避免誤送到群組 */
function canSendToOA() {
  if (!inLINE()) return false;
  const c = liff.getContext && liff.getContext();
  // utou = 一對一聊天室；需在 LIFF 設定勾選 chat_message.write
  return !!c && c.type === 'utou' && (!c.scope || c.scope.indexOf('chat_message.write') > -1);
}

/* ═════════════ 問題回報 ═════════════ */
let rType = '歌詞錯誤';
function openReport(songIdx) {
  const s = currentService();
  $('#rCtx').textContent = s ? `${S.site}｜${md(s.date)}（${WD[toDate(s.date).getDay()]}）${s.label}` : S.site;
  $('#rSong').innerHTML = '<option value="">不限定歌曲</option>' +
    S.view.map((v, i) => `<option value="${i}">${esc(v.title)}${v.type === 'response' ? '（回應）' : ''}</option>`).join('');
  if (songIdx != null) $('#rSong').value = songIdx;
  $('#rHint').textContent = canSendToOA()
    ? '送出後，回報會出現在你與官方帳號的聊天室，同工會在那裡回覆你。'
    : '回報會記錄給教會同工處理。從官方帳號選單開啟本頁，回報才會同步出現在聊天室。';
  $('#rSubmit').disabled = false; $('#rSubmit').textContent = '送出';
  $('#report').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeReport() {
  $('#report').hidden = true;
  document.body.style.overflow = '';
}
async function submitReport(e) {
  e.preventDefault();
  const content = $('#rText').value.trim();
  if (!content) { $('#rText').focus(); return; }
  const s = currentService();
  const v = S.view[$('#rSong').value];
  const song = v ? v.name : '';
  const btn = $('#rSubmit');
  btn.disabled = true; btn.textContent = '送出中…';

  const text = [
    '【問題回報｜敬拜同工查詢】',
    `類型：${rType}`,
    `場次：${$('#rCtx').textContent}`,
    song ? `歌曲：${song}` : '',
    `說明：${content}`
  ].filter(Boolean).join('\n');

  let via = '', name = '';
  if (canSendToOA()) {
    try { await liff.sendMessages([{ type: 'text', text }]); via = 'LINE'; } catch (err) {}
    try { name = (await liff.getProfile()).displayName; } catch (err) {}
  }
  let logged = false, why = '';
  try {
    // text/plain 不會觸發 CORS 預檢，GAS 可以直接接收
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'report', name, site: S.site, date: s ? s.date : '', song, type: rType, text: content, via: via || '網頁', page: location.href })
    });
    const raw = await res.text();
    try {
      const j = JSON.parse(raw);
      logged = j.ok === true;
      if (!logged) why = j.error || '伺服器未接受';
    } catch (err) {
      // 回傳不是 JSON：通常是 GAS 尚未部署含 doPost 的新版本，或新權限尚未授權
      why = /doPost/.test(raw) ? '伺服器尚未更新（找不到 doPost）' : '伺服器回應異常（可能尚未授權）';
    }
  } catch (err) {
    why = '無法連線到伺服器';
  }

  if (!via && !logged) {
    btn.disabled = false; btn.textContent = '送出';
    alert('送出失敗：' + why + '\n請稍後再試，或直接在 LINE 告訴同工');
    return;
  }
  $('#rText').value = '';
  closeReport();
  toast(via ? '已送出，回報已傳到官方帳號' : '已送出，謝謝你的回報');
}
let toastTimer = 0;
function toast(t) {
  const el = $('#toast');
  el.textContent = t; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t || !S.data || t.dataset.site === S.site) return;
  S.site = t.dataset.site;
  const list = S.data.sites[S.site] || [];
  if (!list.some(s => s.date === S.date)) S.date = defaultDate(list);   // 同一天就保留，方便兩堂比對
  render();
});

$('#dates').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c || c.dataset.date === S.date) return;
  S.date = c.dataset.date;
  render();
  window.scrollTo({ top: 0 });
});

$('#main').addEventListener('click', e => {
  if (e.target.closest('[data-report]')) return openReport();
  if (e.target.closest('#playAll')) return $('#playAll').classList.contains('on') ? stopPlaylist() : startPlaylist(0);
  if (e.target.closest('#plLoop')) {
    PL.loop = !PL.loop;
    const b = $('#plLoop');
    b.classList.toggle('on', PL.loop); b.setAttribute('aria-pressed', PL.loop);
    writePref('plLoop', PL.loop ? '1' : '0');
    toast(PL.loop ? '清單循環：開' : '清單循環：關');
    return;
  }
  const li = e.target.closest('[data-pl]');
  if (li && !e.target.closest('a')) {
    if (!$('#playAll').classList.contains('on')) startPlaylist(+li.dataset.pl);
    else plGo(+li.dataset.pl);
    return;
  }
  if (e.target.closest('#rosterBtn')) {
    const btn = $('#rosterBtn'), box = $('#roster');
    box.hidden = !box.hidden; btn.classList.toggle('open', !box.hidden);
    writePref('rosterOpen', box.hidden ? '0' : '1');
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const i = +b.dataset.i;
  switch (b.dataset.act) {
    case 'play': play(i); break;
    case 'toggle': {
      const p = S.players[i];
      if (p && p.getPlayerState && p.getPlayerState() === YT.PlayerState.PLAYING) p.pauseVideo();
      else play(i);
      break;
    }
    case 'loop':
      S.loop.has(i) ? S.loop.delete(i) : S.loop.add(i);
      b.classList.toggle('on', S.loop.has(i));
      break;
    case 'lyrics': {
      const box = $('#lyr-' + i);
      if (!box.innerHTML) box.innerHTML = lyricsHTML(S.view[i].lyrics);
      box.hidden = !box.hidden;
      b.classList.toggle('on', !box.hidden);
      b.textContent = box.hidden ? '歌詞' : '收合';
      break;
    }
    case 'sheet': openViewer(i); break;
    case 'share': share(i); break;
  }
});

$('#vClose').addEventListener('click', closeViewer);
$('#vPrev').addEventListener('click', () => S.viewerIdx > 0 && openViewer(S.viewerIdx - 1));
$('#vNext').addEventListener('click', () => S.viewerIdx < S.view.length - 1 && openViewer(S.viewerIdx + 1));

$('#rClose').addEventListener('click', closeReport);
$('#report').addEventListener('click', e => { if (e.target.id === 'report') closeReport(); });
$('#rType').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  rType = b.textContent;
  $('#rType').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});
$('#reportForm').addEventListener('submit', submitReport);

/* ═════════════ 啟動 ═════════════ */
/** 先完成 LIFF 初始化再載入資料，避免網址參數被提早改寫而影響 LIFF 登入與轉址 */
function initLiff() {
  if (!LIFF_ID) return Promise.resolve();
  return new Promise(resolve => {
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = () => liff.init({ liffId: LIFF_ID }).then(() => { liffOK = true; }).catch(() => {}).finally(resolve);
    s.onerror = resolve;
    document.head.appendChild(s);
    setTimeout(resolve, 5000);                       // 最多等 5 秒，LINE 異常時頁面仍可使用
  });
}
// 三件事同時進行：取資料、LIFF 初始化、顯示本機資料
const freshPromise = fetchFresh();
freshPromise.catch(() => {});
load(freshPromise);
initLiff().then(() => { urlReady = true; syncURL(); });
</script>
